name: insurance-th7
services:
  postgres-payment:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: ${TH7_POSTGRES_PASSWORD:?Set TH7_POSTGRES_PASSWORD}
      POSTGRES_DB: lab_netmicro_payments
    volumes:
      - th7-postgres-data:/var/lib/postgresql/data
      - ./th7-createdatabases.sql:/docker-entrypoint-initdb.d/10-jobs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_netmicro_payments"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  th7-postgres-data:
